dth:276px;color:#526078}.btn{height:37px;padding:0 17px;border:0;border-radius:6px;cursor:pointer;font-weight:600}.btn.primary{background:var(--blue);color:#fff;box-shadow:0 5px 10px #2864f030}.btn.light{background:transparent;color:#64718a}.profile{display:grid;grid-template-columns:1fr auto;gap:25px;padding:21px 24px;margin-top:18px}.profile-left{display:flex;align-items:center;gap:16px}.avatar{width:54px;height:54px;background:linear-gradient(145deg,#ff9a76,#765be8);font-size:18px;border:3px solid #f1f4ff}.name-row{display:flex;align-items:center;gap:9px}.name-row b{font-size:17px}.nn{color:var(--muted);font-size:12px;margin-top:3px}.tags{margin-top:9px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}.label{font-size:12px;color:var(--muted);margin-right:3px}.chip,.status{padding:3px 8px;border-radius:4px;font-size:12px;white-space:nowrap}.chip{color:#51617b;background:#f3f6fb;border:1px solid #e4eaf3}.status.normal{background:#e8f8f2;color:#07875f}.status.risk{background:#fff5df;color:#bd7900}.status.black{background:#fff0f0;color:#d43f4b}.profile-right{border-left:1px solid var(--line);padding-left:25px;min-width:255px;display:flex;flex-direction:column;justify-content:center;gap:9px}.state-legend{display:flex;gap:7px}.state-title{font-size:12px;color:var(--muted)}.current{font-size:13px}.current b{color:var(--green)}.list-card{margin-top:20px;overflow:hidden}.list-title{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 16px}.list-title h2{font-size:17px;margin:0}.count{color:var(--muted);font-size:12px}.table{width:100%;border-collapse:collapse}.table th{height:43px;padding:0 24px;background:#f8faff;color:#75829a;text-align:left;font-size:12px;font-weight:500}.table td{height:59px;padding:0 24px;border-bottom:1px solid var(--line);white-space:nowrap}.table tr.data:hover{background:#fafcff}.game-id{font-family:Consolas,monospace;font-size:12px;color:#52627d}.score{font-weight:700;color:#e27312}.link{border:0;background:transparent;color:var(--blue);padding:0;cursor:pointer;font:inherit}.detail-row td{height:auto;padding:0 24px 20px;background:#fbfcff}.detail{border:1px solid #dce7ff;border-radius:9px;background:linear-gradient(105deg,#f4f8ff,#fbfdff);padding:18px 20px;animation:reveal .25s ease}.detail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.detail-head b{font-size:15px}.total{color:#466180;font-size:12px}.total strong{font-size:20px;color:var(--blue);margin-left:5px}.score-table{border:1px solid #e3eaf7;border-radius:6px;overflow:hidden;background:#fff;width:100%;border-collapse:collapse}.score-table th,.score-table td{height:34px;padding:0 13px;border-bottom:1px solid #edf0f6;text-align:left;font-size:12px}.score-table th{background:#f7f9fd;color:#74829a;font-weight:500}.score-table tr:last-child td{border-bottom:0}.score-table td:last-child,.score-table th:last-child{width:27%;font-weight:600;color:#315bb9}@keyframes reveal{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}@media(max-width:1180px){.main{padding:25px}.side{width:185px}.profile{grid-template-columns:1fr}.profile-right{border-left:0;border-top:1px solid var(--line);padding:15px 0 0}.table th,.table td{padding:0 12px}}
    .status.controlled{background:#fff0f0;color:#d43f4b}
  </style>
  <style>
    /* 对局风控状态与账号黑名单共用红色语义。 */
    .status.controlled { background: #fff0f0 !important; color: #d43f4b !important; }
  </style>
    <style>
      .match-tabs{display:flex;gap:26px;height:42px;align-items:flex-start}.match-tab{height:42px;border:0;border-bottom:2px solid transparent;background:transparent;padding:0;color:#7e8aa3;font:600 17px/40px "Microsoft YaHei","PingFang SC",sans-serif;cursor:pointer}.match-tab.active{color:#2864f0;border-color:#2864f0}.match-panel.hidden{display:none}.fleet-selector{margin:0 24px 18px;padding:13px 16px;border:1px solid #e2e8f3;border-radius:8px;background:#fafcff;display:flex;align-items:center;gap:14px}.fleet-selector label{color:#67748c;font-size:12px}.fleet-select{height:34px;min-width:260px;padding:0 10px;border:1px solid #d9e1ed;border-radius:5px;background:#fff;color:#27354c;outline:0}.fleet-members{display:flex;align-items:center;margin-left:auto}.fleet-member{position:relative;width:28px;height:28px;margin-left:-6px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7b95dc,#5c60a6);color:#fff;font-size:10px}.fleet-member:first-child{margin-left:0}.fleet-members small{margin-left:9px;color:#7e8aa3}.member-stack{display:flex;min-width:290px;align-items:center}.member-pill{display:flex;align-items:center;gap:5px;margin-right:8px}.member-face{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ff9b7d,#7057c7);color:#fff;font-size:10px}.member-pill em{font-style:normal;color:#7c899f;font-size:11px}.member-pill .status{padding:2px 5px;font-size:10px}.fleet-score{font-weight:700;color:#e27312}.report-ok{color:#07875f}.report-fail{color:#d43f4b;font-weight:600}.fleet-detail{padding:18px 20px;border:1px solid #dce7ff;border-radius:9px;background:#f8fbff}.fleet-detail-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.member-score-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e3eaf7;border-radius:6px;overflow:hidden}.member-score-table th,.member-score-table td{height:35px;padding:0 13px;border-bottom:1px solid #edf0f6;text-align:left;font-size:12px}.member-score-table th{background:#f7f9fd;color:#74829a;font-weight:500}.member-score-table tr:last-child td{border-bottom:0}
      .member-view-btn{height:34px;padding:0 12px;border:1px solid #b9ccff;border-radius:5px;background:#fff;color:#2864f0;font:13px "Microsoft YaHei","PingFang SC",sans-serif;cursor:pointer}.member-view-btn:hover{background:#edf3ff}.member-modal-mask{position:fixed;z-index:20;inset:0;display:none;align-items:center;justify-content:center;background:rgba(12,24,47,.42)}.member-modal-mask.show{display:flex}.member-modal{width:540px;border-radius:12px;background:#fff;box-shadow:0 20px 60px rgba(13,29,59,.24);overflow:hidden}.member-modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid #edf0f6}.member-modal-head h3{margin:0;font-size:17px}.modal-close{border:0;background:transparent;color:#7e8aa3;font-size:23px;line-height:1;cursor:pointer}.member-modal-body{padding:8px 22px 18px}.member-modal-row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid #eff2f7}.member-modal-row:last-child{border-bottom:0}.member-modal-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ff9b7d,#7057c7);color:#fff;font-weight:700}.member-modal-name{font-weight:600}.member-modal-nn{margin-left:auto;color:#7e8aa3;font-size:12px}
    </style>
  </head>
<body>
  <div class="shell"><aside class="side"><div class="brand"><span class="brand-mark">NN</span>NN 运营后台</div><div class="sub">运营管理</div><button class="nav"><span>▦</span>数据看板</button><button class="nav"><span>♙</span>用户管理</button><button class="nav active"><span>◫</span>对局查询</button><button class="nav"><span>◈</span>风控管理</button><div class="sub">系统设置</div><button class="nav"><span>⚙</span>配置管理</button><div class="side-bottom">活动运营中心<br>v1.0.0</div></aside>
  <main class="main"><header class="topbar"><div><div class="crumb">活动管理 / 对局查询</div><h1>用户对局查询</h1></div><div class="operator"><span>运营管理员</span><span class="operator-avatar">管</span></div></header>
    <section class="card search"><div class="field"><label>NN号</label><input id="nn" class="control" value="10002866" placeholder="请输入NN号" /></div><div class="field"><label>对局上报时间</label><input id="date" class="control date" value="2026-07-01 至 2026-07-31" /></div><div class="field"><label>游戏</label><select class="control"><option>英雄联盟</option><option>王者荣耀</option></select></div><button class="btn primary" id="searchBtn">查询</button><button class="btn light" id="resetBtn">重置</button></section>
    <section class="card profile"><div class="profile-left"><div class="avatar">野</div><div><div class="name-row"><b id="nickname">野区小霸王</b><span class="status normal">正常</span></div><div class="nn">NN号：<span id="nnDisplay">10002866</span></div><div class="tags"><span class="label">历史游戏账号</span><span class="chip">艾欧尼亚 · ShadowFox#1234</span><span class="chip">峡谷之巅 · 野区小霸王#8899</span><span class="chip">微信区 · 王者小野</span></div></div></div><div class="profile-right"><span class="state-title">账号状态说明</span><div class="state-legend"><span class="status normal">正常</span><span class="status black">黑名单</span></div><span class="current">当前状态：<b>正常</b></span></div></section>
    <section class="card list-card"><div class="list-title"><div class="match-tabs"><button class="match-tab active" type="button" data-panel="user">对局信息</button><button class="match-tab" type="button" data-panel="fleet">车队对局信息</button></div><span class="count" id="count">共 10 条</span></div><div class="match-panel" id="userPanel"><table class="table"><thead><tr><th>对局上报时间</th><th>游戏对局ID</th><th>游戏账号</th><th>NN号</th><th>游戏类型</th><th>总得分</th><th>是否被风控</th><th>操作</th></tr></thead><tbody id="matches"></tbody></table></div><div class="match-panel hidden" id="fleetPanel"><div class="fleet-selector"><label for="fleetSelect">选择车队</label><select id="fleetSelect" class="fleet-select"></select><button class="member-view-btn" id="viewFleetMembers" type="button">查看车队成员</button><div class="fleet-members" id="fleetPreview"></div></div><table class="table"><thead><tr><th>对局上报时间</th><th>对局ID</th><th>本局得分</th><th>上报状态</th><th>操作</th></tr></thead><tbody id="fleetMatches"></tbody></table></div></section>
  </main></div>
  <div class="member-modal-mask" id="fleetMemberModal" role="dialog" aria-modal="true" aria-labelledby="fleetMemberTitle"><div class="member-modal"><div class="member-modal-head"><h3 id="fleetMemberTitle">车队成员</h3><button class="modal-close" id="closeFleetMembers" type="button" aria-label="关闭">×</button></div><div class="member-modal-body" id="fleetMemberList"></div></div></div>
  <script>
    const scoreItems=[['3人在NN语音房组队开黑一场经典模式','2分'],['与同一人(双方均在NN语音房)第二次开黑','双方各+1分'],['游戏获胜','3分'],['拿到一血','1分'],['单场达成五杀','3分(不重复累加四杀分)'],['斩杀峡谷大龙','全队各+1分']];
    const matchRows=[
      ['2026-07-30 21:48:36','LOL_20260730_884921','ShadowFox#1234','10002866','峡谷排位','12','正常'],
      ['2026-07-29 22:13:08','LOL_20260729_772405','野区小霸王#8899','10002866','匹配模式','8','正常'],
      ['2026-07-28 20:31:44','LOL_20260728_739162','ShadowFox#1234','10002866','峡谷排位','9','被风控'],
      ['2026-07-27 20:26:51','LOL_20260727_661208','ShadowFox#1234','10002866','峡谷排位','6','正常'],
      ['2026-07-26 19:54:12','LOL_20260726_550184','野区小霸王#8899','10002866','极地大乱斗','3','正常'],
      ['2026-07-24 22:07:29','LOL_20260724_482970','ShadowFox#1234','10002866','匹配模式','7','被风控'],
      ['2026-07-23 21:19:06','LOL_20260723_306551','野区小霸王#8899','10002866','峡谷排位','10','正常'],
      ['2026-07-21 20:42:38','LOL_20260721_198334','ShadowFox#1234','10002866','无限火力','5','正常'],
      ['2026-07-19 22:35:17','LOL_20260719_965280','ShadowFox#1234','10002866','峡谷排位','11','被风控'],
      ['2026-07-17 19:28:43','LOL_20260717_841726','野区小霸王#8899','10002866','匹配模式','4','正常']
    ];let open=0;
    function detail(){return `<div class="detail"><div class="detail-head"><b>得分明细</b><span class="total">本局总得分 <strong>12分</strong></span></div><table class="score-table"><thead><tr><th>得分项</th><th>分值</th></tr></thead><tbody>${scoreItems.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</tbody></table></div>`}
    function render(){
      document.getElementById('matches').innerHTML=matchRows.map((m,i)=>`<tr class="data"><td>${m[0]}</td><td class="game-id">${m[1]}</td><td>${m[2]}</td><td>${m[3]}</td><td>${m[4]}</td><td class="score">${m[5]}分</td><td><span class="status ${m[6]==='正常'?'normal':'controlled'}">${m[6]}</span></td><td><button class="link score-toggle" type="button" data-index="${i}">${open===i?'收起明细':'查看得分明细'}</button></td></tr>${open===i?`<tr class="detail-row"><td colspan="8">${detail()}</td></tr>`:''}`).join('');
      document.querySelectorAll('.score-toggle').forEach(button=>button.addEventListener('click',()=>{open=open===Number(button.dataset.index)?-1:Number(button.dataset.index);render()}));
    }
    const fleets=[
      {name:'车队1',members:[['野','野区小霸王','10002866',false],['风','疾风剑豪','10011345',false],['月','月下独酌','10023561',true],['团','团战发动机','10036712',false],['熊','小熊软糖','10048908',false]],games:[['2026-07-30 21:48:36','FLEET_20260730_301','12',true],['2026-07-28 20:31:44','FLEET_20260728_178','9',false],['2026-07-23 21:19:06','FLEET_20260723_094','10',false]]},
      {name:'车队2',members:[['野','野区小霸王','10002866',false],['星','星河入梦','10059031',false],['柠','柠檬汽水','10062289',false],['布','布偶猫','10074560',false],['夜','夜航船','10086142',false]],games:[['2026-07-29 22:13:08','FLEET_20260729_265','8',false],['2026-07-24 22:07:29','FLEET_20260724_106','7',false]]}
    ];
    let activeFleet=0,openFleetGame=0;
    const memberHtml=member=>`<span class="member-pill"><span class="member-face">${member[0]}</span><span>${member[1]}<em>· ${member[2]}</em></span>${member[3]?'<span class="status black">黑名单</span>':''}</span>`;
    function renderFleet(){
      const fleet=fleets[activeFleet],select=document.getElementById('fleetSelect');
      select.innerHTML=fleets.map((item,index)=>`<option value="${index}" ${index===activeFleet?'selected':''}>${item.name}：${item.members.map(member=>member[1]).join('、')}</option>`).join('');
      document.getElementById('fleetPreview').innerHTML=`${fleet.members.map(member=>`<span class="fleet-member" title="${member[1]}">${member[0]}</span>`).join('')}<small>共 ${fleet.members.length} 人</small>`;
      document.getElementById('fleetMatches').innerHTML=fleet.games.map((game,index)=>{const failed=game[3];return `<tr class="data"><td>${game[0]}</td><td class="game-id">${game[1]}</td><td class="fleet-score">${game[2]}分</td><td class="${failed?'report-fail':'report-ok'}">${failed?'上报失败':'正常'}</td><td><button class="link fleet-toggle" type="button" data-index="${index}">${openFleetGame===index?'收起明细':'车队得分明细'}</button></td></tr>${openFleetGame===index?`<tr class="detail-row"><td colspan="5"><div class="fleet-detail"><div class="fleet-detail-title"><b>车队得分明细</b><span class="total">本局总得分 <strong>${game[2]}分</strong></span></div><table class="member-score-table"><thead><tr><th>成员</th><th>NN号</th><th>是否被风控</th><th>个人得分</th><th>得分构成</th></tr></thead><tbody>${fleet.members.map((member,memberIndex)=>`<tr><td>${member[1]}</td><td>${member[2]}</td><td>${member[3]?'<span class="status black">黑名单</span>':'<span class="status normal">正常</span>'}</td><td>${[3,2,2,3,2][memberIndex]}分</td><td>${memberIndex===0?'对局胜利、首杀':'组队开黑、对局参与'}</td></tr>`).join('')}</tbody></table></div></td></tr>`:''}`}).join('');
      document.querySelectorAll('.fleet-toggle').forEach(button=>button.addEventListener('click',()=>{openFleetGame=openFleetGame===Number(button.dataset.index)?-1:Number(button.dataset.index);renderFleet()}));
      select.onchange=event=>{activeFleet=Number(event.target.value);openFleetGame=0;renderFleet()};
    }
    function openFleetMembers(){const fleet=fleets[activeFleet];document.getElementById('fleetMemberTitle').textContent=`${fleet.name} · 车队成员`;document.getElementById('fleetMemberList').innerHTML=fleet.members.map(member=>`<div class="member-modal-row"><span class="member-modal-avatar">${member[0]}</span><span class="member-modal-name">${member[1]}</span><span class="member-modal-nn">NN号：${member[2]}</span></div>`).join('');document.getElementById('fleetMemberModal').classList.add('show')}
    function closeFleetMembers(){document.getElementById('fleetMemberModal').classList.remove('show')}
    document.getElementById('viewFleetMembers').addEventListener('click',openFleetMembers);
    document.getElementById('closeFleetMembers').addEventListener('click',closeFleetMembers);
    document.getElementById('fleetMemberModal').addEventListener('click',event=>{if(event.target.id==='fleetMemberModal')closeFleetMembers()});
    document.querySelectorAll('.match-tab').forEach(tab=>tab.addEventListener('click',()=>{const isFleet=tab.dataset.panel==='fleet';document.querySelectorAll('.match-tab').forEach(item=>item.classList.toggle('active',item===tab));document.getElementById('userPanel').classList.toggle('hidden',isFleet);document.getElementById('fleetPanel').classList.toggle('hidden',!isFleet);document.getElementById('count').textContent=isFleet?`共 ${fleets[activeFleet].games.length} 条`:'共 10 条';if(isFleet)renderFleet()}));
    render();
    document.getElementById('searchBtn').onclick=()=>{const value=document.getElementById('nn').value.trim();if(!value){alert('请输入 NN 号');return}document.getElementById('nnDisplay').textContent=value;document.getElementById('count').textContent='共 10 条（已按查询条件筛选）';document.getElementById('nickname').textContent=value==='10002866'?'野区小霸王':'查询用户';open=0;render()};
    document.getElementById('resetBtn').onclick=()=>{document.getElementById('nn').value='';document.getElementById('date').value='';document.getElementById('count').textContent='共 10 条';};
  </script>
</body>
</html>
